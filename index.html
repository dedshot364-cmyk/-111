<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание занятий | Факультет права</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <div class="max-w-6xl mx-auto p-4 sm:p-6">
        <!-- Шапка -->
        <header class="mb-6 text-center sm:text-left border-b border-slate-800 pb-4">
            <h1 class="text-2xl sm:text-3xl font-bold text-blue-400">
                <i class="fa-solid me-2"></i>Расписание Академии МВД
            </h1>
            <p class="text-slate-400 text-sm mt-1">2 курс • Факультет права</p>
        </header>

        <!-- Фильтры и Управление -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <!-- Выбор группы -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">ГРУППА</label>
                <div class="flex gap-2" id="groupSelector">
                    <button onclick="setGroup('5501')" class="group-btn flex-1 py-2 px-3 rounded-lg bg-blue-600 font-semibold text-sm hover:bg-blue-500 transition">5501</button>
                    <button onclick="setGroup('5502')" class="group-btn flex-1 py-2 px-3 rounded-lg bg-slate-800 font-semibold text-sm hover:bg-slate-700 transition">5502</button>
                    <button onclick="setGroup('5503')" class="group-btn flex-1 py-2 px-3 rounded-lg bg-slate-800 font-semibold text-sm hover:bg-slate-700 transition">5503</button>
                </div>
            </div>

            <!-- Поиск -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">ПОИСК</label>
                <div class="relative">
                    <input type="text" id="searchInput" oninput="render()" placeholder="Предмет, преподаватель, ауд..." 
                           class="w-full bg-slate-800 border border-slate-700 rounded-lg py-2 pl-9 pr-3 text-sm focus:outline-none focus:border-blue-500">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-500 text-xs"></i>
                </div>
            </div>

            <!-- Выбор даты -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">ФИЛЬТР ПО ДАТЕ</label>
                <input type="date" id="dateFilter" onchange="render()" 
                       class="w-full bg-slate-800 border border-slate-700 rounded-lg py-2 px-3 text-sm focus:outline-none focus:border-blue-500">
            </div>
        </div>

        <!-- Контейнер карточек расписания -->
        <div id="scheduleContainer" class="space-y-4"></div>
    </div>

    <script>
        let allEvents = [];
        let currentGroup = '5501';

        async function init() {
            try {
                const res = await fetch('schedule.json');
                allEvents = await res.json();
                render();
            } catch (e) {
                document.getElementById('scheduleContainer').innerHTML = 
                    `<div class="p-4 bg-red-900/30 border border-red-800 text-red-300 rounded-lg">Ошибка загрузки расписания. Проверьте наличие schedule.json</div>`;
            }
        }

        function setGroup(group) {
            currentGroup = group;
            document.querySelectorAll('.group-btn').forEach(btn => {
                if (btn.innerText === group) {
                    btn.className = "group-btn flex-1 py-2 px-3 rounded-lg bg-blue-600 font-semibold text-sm hover:bg-blue-500 transition";
                } else {
                    btn.className = "group-btn flex-1 py-2 px-3 rounded-lg bg-slate-800 font-semibold text-sm hover:bg-slate-700 transition";
                }
            });
            render();
        }

        function render() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const selectedDate = document.getElementById('dateFilter').value;
            const container = document.getElementById('scheduleContainer');
            
            let filtered = allEvents.filter(e => e.group === currentGroup);

            if (selectedDate) {
                filtered = filtered.filter(e => e.date === selectedDate);
            }

            if (search) {
                filtered = filtered.filter(e => e.text.toLowerCase().includes(search) || e.date.includes(search));
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500">Занятий не найдено</div>`;
                return;
            }

            // Группировка по датам
            const groupedByDate = {};
            filtered.forEach(e => {
                if (!groupedByDate[e.date]) groupedByDate[e.date] = [];
                groupedByDate[e.date].push(e);
            });

            let html = '';
            const daysOfWeek = ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];

            Object.keys(groupedByDate).sort().forEach(dateStr => {
                const d = new Date(dateStr);
                const dayName = daysOfWeek[d.getDay()];
                const formattedDate = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

                html += `
                    <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl overflow-hidden shadow-lg">
                        <div class="bg-slate-800 px-4 py-3 border-b border-slate-700/60 flex justify-between items-center">
                            <span class="font-bold text-blue-300">${dayName}</span>
                            <span class="text-xs text-slate-400">${formattedDate}</span>
                        </div>
                        <div class="divide-y divide-slate-700/40">
                `;

                groupedByDate[dateStr].sort((a,b) => a.pair - b.pair).forEach(item => {
                    const lines = item.text.split('\n').map(l => l.trim()).filter(Boolean);
                    const title = lines[0] || item.text;
                    const details = lines.slice(1).join(' • ');

                    html += `
                        <div class="p-4 flex flex-col sm:flex-row gap-3 items-start sm:items-center">
                            <div class="flex sm:flex-col items-center gap-2 min-w-[110px]">
                                <span class="bg-blue-950 text-blue-400 text-xs font-bold px-2.5 py-1 rounded border border-blue-800">${item.pair} пара</span>
                                <span class="text-xs text-slate-400 font-mono">${item.time}</span>
                            </div>
                            <div class="flex-1">
                                <div class="font-medium text-slate-100">${title}</div>
                                ${details ? `<div class="text-xs text-slate-400 mt-1">${details}</div>` : ''}
                            </div>
                        </div>
                    `;
                });

                html += `</div></div>`;
            });

            container.innerHTML = html;
        }

        init();
    </script>
</body>
</html>
